#cloud-config
package_update: true
package_upgrade: true

packages:
  - jq
  - curl
  - unzip
  - python3-pip
  - python3-venv

runcmd:
  - |
    hostnamectl set-hostname frontend.${brand}.internal
    echo "127.0.0.1 frontend.${brand}.internal" >> /etc/hosts

  - |
    curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults

  - |
    pip3 install pipx --quiet
    /usr/local/bin/pipx install ansible-core
    /usr/local/bin/pipx inject ansible-core ansible
    export PATH="$PATH:/root/.local/bin"
    ansible-galaxy collection install ansible.posix

  - |
    PRIVATE_IP=$(curl -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/instance/metadata/privateIp 2>/dev/null || true)
    echo "Instance IP: $PRIVATE_IP" >> /var/log/cloud-init-custom.log

  - |
    export PATH="$PATH:/root/.local/bin:/root/bin"
    echo "Downloading frontend Ansible playbook..." >> /var/log/cloud-init-custom.log
    /root/bin/oci os object get \
      --bucket-name ${project}-system \
      --name ansible/playbooks/frontend.yml \
      --file /tmp/frontend.yml \
      --region ${region} \
      --auth instance_principal 2>>/var/log/cloud-init-custom.log

  - |
    export PATH="$PATH:/root/.local/bin:/root/bin"
    echo "Running frontend Ansible playbook..." >> /var/log/cloud-init-custom.log
    ansible-playbook /tmp/frontend.yml \
      -e "project=${project}" \
      -e "environment=${environment}" \
      -e "brand=${brand}" \
      -e "region=${region}" \
      -e 'nfs_mount_ips=${nfs_mount_ips}' \
      -e "mysql_host=${mysql_host}" \
      -e "opensearch_fqdn=${opensearch_fqdn}" \
      -e "os_namespace=${os_namespace}" \
      -e "vault_id=${vault_id}" \
      -e "compartment_id=${compartment_id}" \
      2>&1 | tee -a /var/log/cloud-init-custom.log

final_message: "Frontend instance initialized in ${project} (${environment})"
