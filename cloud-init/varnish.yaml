#cloud-config
package_update: true
package_upgrade: true

packages:
  - jq
  - curl
  - unzip
  - varnish
  - python3-pip
  - python3-venv

runcmd:
  - |
    hostnamectl set-hostname varnish.${brand}.internal
    echo "127.0.0.1 varnish.${brand}.internal" >> /etc/hosts

  - |
    curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults

  - |
    pip3 install pipx --quiet
    /usr/local/bin/pipx install ansible-core
    /usr/local/bin/pipx inject ansible-core ansible
    export PATH="$PATH:/root/.local/bin"

  - |
    PRIVATE_IP=$(curl -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/instance/metadata/privateIp 2>/dev/null || true)
    echo "Varnish instance IP: $PRIVATE_IP" >> /var/log/cloud-init-custom.log

  - |
    export PATH="$PATH:/root/.local/bin:/root/bin"
    echo "Downloading varnish Ansible playbook..." >> /var/log/cloud-init-custom.log
    /root/bin/oci os object get \
      --bucket-name ${project}-system \
      --name ansible/playbooks/varnish.yml \
      --file /tmp/varnish.yml \
      --region ${region} \
      --auth instance_principal 2>>/var/log/cloud-init-custom.log

  - |
    export PATH="$PATH:/root/.local/bin:/root/bin"
    echo "Running varnish Ansible playbook..." >> /var/log/cloud-init-custom.log
    ansible-playbook /tmp/varnish.yml \
      -e "project=${project}" \
      -e "environment=${environment}" \
      -e "brand=${brand}" \
      -e "region=${region}" \
      -e "vcn_cidr=${vcn_cidr}" \
      2>&1 | tee -a /var/log/cloud-init-custom.log

final_message: "Varnish instance initialized in ${project} (${environment})"
